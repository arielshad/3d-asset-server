name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # On main: publish ghcr.io/arielshad/3d-asset-server:{latest,sha-<commit>} and,
  # if SHEP_INFRA_TOKEN is set (fine-grained PAT, contents:write on
  # shep-ai/shep-infra), pin that tag in shep-infra so ArgoCD rolls it out to
  # 3d.shep.bot. Without the token, the cluster runs :latest (pulled on restart).
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    env:
      SHEP_INFRA_TOKEN: ${{ secrets.SHEP_INFRA_TOKEN }}
    steps:
      - name: Pin image in shep-infra
        if: env.SHEP_INFRA_TOKEN != ''
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${SHEP_INFRA_TOKEN}@github.com/shep-ai/shep-infra.git" infra
          cd infra
          f=apps/3d-asset-server/manifests/deployment.yaml
          tag="sha-${GITHUB_SHA}"
          sed -i -E "s#(image: ghcr.io/arielshad/3d-asset-server):[^[:space:]]+#\1:${tag}#" "$f"
          if git diff --quiet; then echo "already pinned to ${tag}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(3d-asset-server): pin image to ${tag}"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
      - name: Skip pin (no SHEP_INFRA_TOKEN)
        if: env.SHEP_INFRA_TOKEN == ''
        run: echo "SHEP_INFRA_TOKEN not set; cluster tracks :latest"
